data:
  dataset_path: /data/extremexp/extremexp_data/ideko/not_anomalous_3periods_3subsampling_6000seqLen.h5
  debug: false
  normalization: global_min_max
  num_channels: 2
  random_seed: 12345
  seq_len: 6000
  split_proportion: 0.2
  val_score: fid_score_statistic
  verbose: false
mlflow:
  URI: http://0.0.0.0:5004
  experiment_id: ideko_tts_na_6000
  is_used: true
  run_name: xp_da
network:
  discriminator:
    depth: 5
    drop_p: 0.5
    emb_size: 100
    forward_drop_p: 0.5
    in_channels: 2
    n_classes: 1
    patch_size: 100
    seq_length: 6000
  generator:
    attn_drop_rate: 0.5
    channels: 2
    depth: 5
    ema: 0.99999
    embed_dim: 150
    forward_drop_rate: 0.5
    latent_dim: 100
    num_heads: 5
    patch_size: 100
    seq_len: 6000
  init_type: xavier_uniform
trainer:
  batch_size: 4
  d_accumulated_times: 1
  d_lr: 0.0001
  early_stopping: 10
  epochs: 701
  g_accumulated_times: 1
  g_lr: 0.0001
  loss:
    d_loss:
      loss_name: lsgan
    g_loss:
      loss_name: lsgan
      wgangp:
        phi: 5
  n_critic: 1
  optimizer:
    adam:
      beta1: 0.9
      beta2: 0.999
    adamw:
      weight_decay: 0.01
    optimizer_name: adam
  scheduler:
    d_scheduler:
      exponential:
        emma: 0.999
      linear:
        end_factor: 0.1
        star_factor: 1.0
      scheduler_name: linear
    g_scheduler:
      exponential:
        gamma: 0.999
      linear:
        end_factor: 0.1
        star_factor: 1.0
      scheduler_name: linear
validator:
  batch_size: 32
  val_freq: 20
