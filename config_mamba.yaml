type: "mamba"
data:
  dataset_path: "/data/extremexp/extremexp_data/unimib-shar/Running.h5" #"/data/datasets_ori/ideko/not_anomalous_3periods_10subsampling_1800seqLen.h5" #"/data/ideko/raw_data_splited/raw_data_subsampled_20/not_anomalous"
  split_proportion: 0.2
  random_seed: 12345
  normalization: "global_min_max" #None, min_max, standarization
  seq_len: 151
  num_channels: 3
  verbose: False
  debug: False
  val_score: "fid_score_temporal" # cosine_similarity, jensen_shannon_divergence, fid_score_statistic


mlflow:
  URI: "http://0.0.0.0:5004"
  experiment_id: "mamba_tts_experiemnts"
  is_used: True
 
trainer:
  batch_size: 64
  epochs: 500  #500
  g_lr: 0.0003
  d_lr: 0.0001
  n_critic: 1 #total updates discriminator before updating discriminator. the generator is trained each n_critic*g_accumulated_times
  g_accumulated_times: 1 #iterations before optimizing generator
  d_accumulated_times: 1 #iterations before optimizing discriminator
  early_stopping: 50
 
  optimizer:
    optimizer_name: adam #adamw
    adam:
      beta1: 0.9
      beta2: 0.999
    adamw:
      weight_decay: 0.01

  scheduler:
    
    g_scheduler:
      scheduler_name: constant #linear, constant,exponential
      exponential:
        gamma: 0.999
      linear:
        star_factor: 1.0 # Initial ratio of lr
        end_factor: 0.1 # Final ratio of lr. on last epoch lr = initial_lr * end_factor

    #linear, constant
    d_scheduler:
      scheduler_name: constant #linear, constant,exponential
      exponential:
        emma: 0.999
      linear:
        star_factor: 1.0
        end_factor: 0.1

  loss: 
    g_loss:
      loss_name: "lsgan" #standard, hinge, lsgan, wgangp
      wgangp:
        phi: 5
    d_loss:
      loss_name: "lsgan" #standard, lsgan, wgangp, wgangp-mode

validator:
  batch_size: 64
  val_freq: 10

network:
  generator:
      hidden_dim: 256           # d_model de mamba, first linear size seq_len*hidden_dim
      d_state: 256              # 
      d_conv: 2                 #
      e_fact: 1                 #
      seq_len: 151              # Sequence length of time series
      channels: 3               # number of features of the time series
      z_dim: 100                # size of input noise vector
      num_layers: 1 
      ema: 0.99999

  discriminator:
      hidden_dim: 256           # d_model de mamba, first linear size seq_len*hidden_dim
      d_state: 256              # 
      d_conv: 2                 #
      e_fact: 1                 #
      seq_len: 151              # Sequence length of time series
      channels: 3               # number of features of the time series
      z_dim: 100                # size of input noise vector
      num_layers: 1 

  init_type: 'xavier_uniform' #orth, xavier_uniform, normal

 

